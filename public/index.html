<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendario Familiar</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
</head>
<body>
  <header>
    <h1>📅 Calendario Familiar</h1>
    <p class="subtitle">Los eventos se cargan escribiendo <code>/evento</code> en el grupo de WhatsApp</p>
  </header>
  <main>
    <div id="calendar"></div>
  </main>
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button id="modal-close" class="modal-close">&times;</button>

      <div id="view-mode">
        <h2 id="modal-title"></h2>
        <p id="modal-date"></p>
        <p id="modal-location"></p>
        <p id="modal-description"></p>
        <div class="modal-actions">
          <button id="btn-edit" class="btn btn-secondary">✏️ Editar</button>
          <button id="btn-delete" class="btn btn-danger">🗑️ Borrar</button>
        </div>
      </div>

      <form id="edit-form" class="hidden">
        <label>Título
          <input type="text" id="edit-title" required />
        </label>
        <label>Fecha y hora
          <input type="datetime-local" id="edit-datetime" required />
        </label>
        <label>Lugar
          <input type="text" id="edit-location" />
        </label>
        <label>Descripción
          <textarea id="edit-description" rows="3"></textarea>
        </label>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">💾 Guardar</button>
          <button type="button" id="btn-cancel-edit" class="btn btn-secondary">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
