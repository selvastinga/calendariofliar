<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Calendario familiar cargado desde WhatsApp" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>" />
  <title>Calendario Familiar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>📅 Calendario Familiar</h1>
      <p class="subtitle">Escribí <code>/evento</code> en el grupo de WhatsApp para cargar una actividad</p>
    </div>
  </header>
  <main>
    <div id="calendar"></div>
  </main>
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button id="modal-close" class="modal-close">&times;</button>

      <div id="view-mode">
        <h2 id="modal-title"></h2>
        <p id="modal-date"></p>
        <p id="modal-location"></p>
        <p id="modal-description"></p>
        <div class="modal-actions">
          <button id="btn-edit" class="btn btn-secondary">✏️ Editar</button>
          <button id="btn-delete" class="btn btn-danger">🗑️ Borrar</button>
        </div>
      </div>

      <form id="edit-form" class="hidden">
        <label>Título
          <input type="text" id="edit-title" required />
        </label>
        <label>Fecha y hora
          <input type="datetime-local" id="edit-datetime" required />
        </label>
        <label>Lugar
          <input type="text" id="edit-location" />
        </label>
        <label>Descripción
          <textarea id="edit-description" rows="3"></textarea>
        </label>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">💾 Guardar</button>
          <button type="button" id="btn-cancel-edit" class="btn btn-secondary">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="day-modal" class="modal hidden">
    <div class="modal-content">
      <button id="day-modal-close" class="modal-close">&times;</button>
      <h2 id="day-modal-title"></h2>
      <ul id="day-events-list" class="day-events-list"></ul>
      <p id="day-events-empty" class="day-events-empty hidden">No hay eventos este día.</p>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
